name = "museai-oauth2"
main = "worker.js"
compatibility_date = "2026-10-28"
workers_dev = true

# KV is for non-atomic data only. One-time codes, device codes, pending
# approvals, and refresh tokens live in the Durable Object below — KV
# cannot consume a record exactly once.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "3d87785008fb439990fb9dde9490c152"

# Atomic store (build step 1, 2026-10-30): one OAuthRecord instance per
# one-time record. See src/store/oauth-record.js.
[[durable_objects.bindings]]
name = "OAUTH_STORE"
class_name = "OAuthRecord"

# Rate-limit counters (build step 3, 2026-10-30): one RateLimitBucket
# instance per bucket key. See src/store/rate-limit.js.
[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitBucket"

# Free-plan note (build step 6, 2026-10-30): Cloudflare's free plan
# refuses to create Durable Object classes from `new_classes`
# (deploy error 10097). Classes must be created with
# `new_sqlite_classes` instead. No deploy had succeeded before this
# change, so no existing class is affected by the switch.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OAuthRecord"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimitBucket"]

# This is not signing-key rotation. See docs/KEY-ROTATION.md before enabling.
[triggers]
crons = []

# Step 8 (2026-10-30): dashboard plain-text variables do NOT survive
# a Workers Builds deploy (v14 and v19 both wiped BASE_PATH, ISSUER,
# SIGNING_PUBLIC_JWK and disabled workers.dev). Public config therefore
# lives here, in the repo, so every push deploys complete. Secrets
# (ADMIN_TOKEN, SIGNING_KEY_JWK) stay dashboard-only, never in the repo.
# SIGNING_PUBLIC_JWK is the PUBLIC key (served by /login/jwks to anyone)
# — safe to commit by design.
[vars]
BASE_PATH = "/login"
ISSUER = "https://www.fedpromptly.com/login"
SIGNING_PUBLIC_JWK = '{"crv":"P-256","ext":true,"key_ops":["verify"],"kty":"EC","x":"QnYjUaF-RspFtioQRv_YE0F5kmmziSLK-iGdDObBRXc","y":"345RqACxWfLp460uc7LgCbaZjsIXvimuH-uYhb3e3Jo"}'
